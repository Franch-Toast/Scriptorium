# Scriptorium 公司站 CI：推送仅构建校验，打 tag 构建通过后发布到 webfile
# 站点地址：https://webfile.deeproute.cn/yifeizhang/
#
# 前置配置（一次性）：GitLab Settings → CI/CD → Variables 添加
#   DR_ACCESS_TOKEN（类型 Variable，勾选 Masked）—— webfile 上传凭证

stages:
  - build
  - deploy

variables:
  NAMESPACE: "yifeizhang"
  # 站点部署在 https://webfile.deeproute.cn/yifeizhang/ ，构建时注入路径前缀
  BASE_PATH: "/yifeizhang/"

# 每次推送都构建校验；产物仅存 artifacts 供排查，不上传 webfile
build:
  stage: build
  image: node:20
  script:
    # 固定 pnpm 版本（与本地一致）：更早的 pnpm 新版默认启用
    # minimumReleaseAge 供应链策略，会拒绝 lockfile 中发布未满冷却期的包
    # （如 vitepress-carbon 依赖的 @iconify-json/simple-icons）
    - npm i -g pnpm@10.32.1
    - pnpm install --frozen-lockfile
    # prebuild 自动执行 frontmatter 校验
    - pnpm build
  artifacts:
    # VitePress 未设 outDir，产物默认在 .vitepress/dist/
    paths:
      - .vitepress/dist/
    expire_in: 1 week

# 仅打 tag 时发布：needs 直接复用 build 的产物，不重复编译
deploy:
  stage: deploy
  image: reg.deeproute.ai/deeproute-public/golang:1.25.6_sudo
  needs: [build]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - curl -fsSL https://webfile.deeproute.cn/webfile-cli/prod/latest/install.sh | bash
    - |
      if [ -z "${DR_ACCESS_TOKEN}" ]; then
        echo "ERROR: DR_ACCESS_TOKEN 未配置，请在 GitLab Settings → CI/CD → Variables 中添加（勾选 Masked）"
        exit 1
      fi
      export DR_ACCESS_TOKEN
      # webfile 目录上传会保留目录名（实测 'Uploading directory dist →
      # /dist'），整目录上传会多出 /dist/ 一层；故进入产物目录循环上传
      # 顶层条目铺根：文件落根（index.html 覆盖旧首页），子目录
      # （assets/、document/、.webfile/）落到对应子路径
      cd ".vitepress/dist" || { echo "ERROR: 构建产物 .vitepress/dist 不存在，请检查 build 阶段 artifacts"; exit 1; }
      # dotglob 使通配符包含点号开头的 .webfile/（advance.md 警告普通
      # 通配符会漏掉它，导致站点配置不随发布更新）
      shopt -s dotglob
      for f in *; do webfile file upload "$f" "${NAMESPACE}:/" --override; done
      # 刷新配置缓存，随产物上传的 /.webfile/config.yaml 立即生效
      webfile site config refresh "${NAMESPACE}"
      echo ""
      echo "发布完成：https://webfile.deeproute.cn/${NAMESPACE}/  (tag: ${CI_COMMIT_TAG})"
