<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">SL：沿参考线走多远，偏到哪一侧</title><desc id="desc">在弯曲参考线上用弧段标记s，从投影点向左侧车辆的法向偏移标记l。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d;font-size:20px} .small{font-size:17px} .head{font-size:26px;font-weight:650} .muted{fill:#475569} .axis{stroke:#475569;stroke-width:2;marker-end:url(#arrow)} .blue{stroke:#2563eb;stroke-width:4;fill:none} .green{stroke:#15803d;stroke-width:5;fill:none} .orange{fill:#ffedd5;stroke:#c2410c;stroke-width:2} .dash{stroke-dasharray:10 8}</style>
<rect width="1100" height="440" rx="16" fill="#f8fafc"/><text x="35" y="43" class="head">SL：沿参考线走多远，偏到哪一侧</text>
<path d="M100 335 C250 335 340 310 440 235 S650 120 940 170" class="blue"/>
<path d="M100 335 C250 335 340 310 440 235" stroke="#1d4ed8" stroke-width="9" fill="none" opacity=".4"/>
<circle cx="100" cy="335" r="7" fill="#2563eb"/><circle cx="440" cy="235" r="7" fill="#2563eb"/>
<path d="M440 235 L390 168" class="axis"/><rect x="357" y="125" width="70" height="40" rx="6" class="orange" transform="rotate(-36 392 145)"/>
<path d="M440 235 L526 173" class="axis"/>
<text x="65" y="375">起点 s = 0</text><text x="240" y="362">沿蓝线累计距离 s</text>
<text x="326" y="207">l</text><text x="550" y="186">参考切向</text><text x="436" y="282">投影点</text>
<text x="335" y="95">车辆位置 (x, y)</text><text x="775" y="220">参考线</text>
<text x="55" y="410" class="small">本图约定左侧 l 为正；换一条参考线，同一车辆位置的 SL 数值会变化。</text>
</svg>